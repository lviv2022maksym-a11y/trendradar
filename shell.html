<title>TrendRadar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TrendRadar: оцінка ВИГІДНО / ЧЕКАТИ / НЕВИГІДНО для криптовалют, живі графіки, пульс ринку, новини, P2P-калькулятор і школа трейдера.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<style>
/*STYLE*/
</style>
<!--BODY-->
<header class="top">
  <div class="wrap">
    <a class="brand" href="#market" aria-label="TrendRadar">
      <span class="logo"><img src="{{LOGO}}" alt="" width="34" height="34"></span>
      <b>Trend<span>Radar</span></b>
    </a>
    <button class="mode" id="mode" type="button"><i></i><span id="mode-t">…</span></button>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-actions">
      <button class="install-btn" id="install-top" type="button" hidden></button>
      <button class="icon-btn" id="theme-btn" type="button"></button>
    </div>
  </div>
</header>
<div class="wrap"><div id="banner"></div></div>
<main class="wrap">
  <section id="v-market"></section>
  <section id="v-memes" hidden></section>
  <section id="v-stocks" hidden></section>
  <section id="v-chart" hidden></section>
  <section id="v-news" hidden></section>
  <section id="v-p2p" hidden></section>
  <section id="v-learn" hidden></section>
  <section id="v-prefs" hidden></section>
  <section id="v-connect" hidden></section>
  <section id="v-more" hidden></section>
</main>
<nav class="bottom-nav" id="bnav" aria-label="TrendRadar"></nav>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <header><h2 id="add-title"></h2><button class="icon-btn" id="add-close" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <label class="sr" for="add-q">Search</label>
    <input class="search" id="add-q" type="search" autocomplete="off" spellcheck="false">
    <ul class="results" id="add-res"></ul>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!--SCRIPTS-->
