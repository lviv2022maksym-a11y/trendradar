<style>
/* Layout: sticky header + view sections; cards grid on Market, chart + side panels on Chart; bottom tab bar on phones. */
:root {
  --bg: #eef2f6; --surface: #ffffff; --surface-2: #f4f7fa; --line: #d9e1ea; --line-2: #c7d2de;
  --fg: #0d1722; --muted: #5a6879; --faint: #8794a5;
  --acc-l: #0b9a86; --acc-d: #2dd4bf; --accent: var(--acc-l); --accent-ink: #ffffff; --accent-soft: rgba(11, 154, 134, 0.10);
  --good: #0f9d58; --bad: #dc3d43; --warn: #b97800;
  --good-bg: #e3f5ea; --bad-bg: #fdeaea; --warn-bg: #fbf1d9;
  --shadow: 0 1px 2px rgba(13, 23, 34, 0.06), 0 4px 16px rgba(13, 23, 34, 0.05);
  --chart-up: #12a37b; --chart-down: #e2474d;
  --ema20: #d9a400; --ema50: #2f7fe0; --ema200: #8b5cf6;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-card: 16px; --r-ctl: 10px;
  --nav-h: 64px;
  --glow-a: rgba(11, 154, 134, 0.07); --glow-b: rgba(124, 58, 237, 0.05);
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080d15; --surface: #0f1722; --surface-2: #142030; --line: #1e2b3d; --line-2: #2a3a50;
    --fg: #e6edf5; --muted: #8b9bb0; --faint: #5f7088;
    --accent: var(--acc-d); --accent-ink: #032621; --accent-soft: rgba(45, 212, 191, 0.12);
    --good: #34c77b; --bad: #ff6b70; --warn: #f2b632;
    --good-bg: rgba(52, 199, 123, 0.13); --bad-bg: rgba(255, 107, 112, 0.13); --warn-bg: rgba(242, 182, 50, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
    --chart-up: #26c08f; --chart-down: #f2555a;
    --ema20: #f2c94c; --ema50: #56a8f5; --ema200: #b083f7;
    --glow-a: rgba(45, 212, 191, 0.10); --glow-b: rgba(139, 92, 246, 0.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080d15; --surface: #0f1722; --surface-2: #142030; --line: #1e2b3d; --line-2: #2a3a50;
  --fg: #e6edf5; --muted: #8b9bb0; --faint: #5f7088;
  --accent: var(--acc-d); --accent-ink: #032621; --accent-soft: rgba(45, 212, 191, 0.12);
  --good: #34c77b; --bad: #ff6b70; --warn: #f2b632;
  --good-bg: rgba(52, 199, 123, 0.13); --bad-bg: rgba(255, 107, 112, 0.13); --warn-bg: rgba(242, 182, 50, 0.13);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
  --chart-up: #26c08f; --chart-down: #f2555a;
  --ema20: #f2c94c; --ema50: #56a8f5; --ema200: #b083f7;
  --glow-a: rgba(45, 212, 191, 0.10); --glow-b: rgba(139, 92, 246, 0.08);
  color-scheme: dark;
}
:root[data-accent="blue"] { --acc-l: #2563eb; --acc-d: #60a5fa; }
:root[data-accent="violet"] { --acc-l: #7c3aed; --acc-d: #a78bfa; }
:root[data-accent="amber"] { --acc-l: #c2410c; --acc-d: #fb923c; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--fg);
  background: radial-gradient(1100px 520px at 8% -8%, var(--glow-a), transparent 62%), radial-gradient(900px 480px at 100% -4%, var(--glow-b), transparent 60%), var(--bg);
  background-attachment: fixed;
  font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .px, .ch, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); flex: none; }
.logo { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--line); }
.logo img { width: 100%; height: 100%; display: block; }
.logo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 300deg, rgba(120, 255, 225, 0.45) 360deg); mix-blend-mode: screen; animation: sweep 4s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
.brand b { font: 600 17px/1 var(--font-display); letter-spacing: -0.02em; }
.brand b span { color: var(--accent); }
.mode { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px 3px 8px; font: 600 11px/1.4 var(--font-mono); letter-spacing: 0.08em; color: var(--muted); }
.mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.mode.live { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.mode.live i { background: var(--good); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
.tabs { display: none; margin-left: auto; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; border-radius: 12px; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 9px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.top-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.icon-btn:hover { border-color: var(--line-2); }
.icon-btn svg { width: 18px; height: 18px; }
.install-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; }
@media (min-width: 960px) {
  .tabs { display: flex; }
  .top-actions { margin-left: 8px; }
  body { padding-bottom: 0; }
  .bottom-nav { display: none !important; }
}

/* ---------- Bottom nav (phones) ---------- */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.bottom-nav a { display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; color: var(--faint); text-decoration: none; font-size: 10.5px; font-weight: 500; border-radius: 10px; }
.bottom-nav a svg { width: 22px; height: 22px; }
.bottom-nav a svg { padding: 2px 10px; box-sizing: content-box; border-radius: 999px; transition: background .25s var(--ease), transform .25s var(--ease); }
.bottom-nav a[aria-current="page"] { color: var(--accent); }
.bottom-nav a[aria-current="page"] svg { background: var(--accent-soft); transform: translateY(-1px); }
.bottom-nav { grid-template-columns: repeat(5, 1fr); }

/* ---------- Banner, toast ---------- */
.banner { display: flex; gap: 10px; align-items: center; margin: 12px 0 0; padding: 6px 6px 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--warn-bg) 80%, transparent); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); font-size: 13px; width: fit-content; max-width: 100%; animation: fadeIn .4s var(--ease) both; }
.banner .b-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); }
.banner .b-txt { min-width: 0; }
.banner .btn { white-space: nowrap; }
.banner.soft { border-radius: 12px; padding: 8px 12px; margin: 0 0 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; }
.btn:hover { border-color: var(--line-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 999px; }
.btn.sm svg { width: 14px; height: 14px; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 50%; background: transparent; border-color: transparent; color: var(--muted); flex: none; }
.icon-btn.sm:hover { background: var(--surface); color: var(--fg); }
.icon-btn.sm svg { width: 14px; height: 14px; }
.btn, .icon-btn, .chip, .seg button, .tabs a, .bottom-nav a, .swatch, .mini { transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease); }
.btn:active, .icon-btn:active, .chip:active, .seg button:active { transform: scale(.97); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 960px) { .toast { bottom: 24px; } }

/* ---------- Views ---------- */
main { padding-block: 18px 28px; }
.view-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.view-h h1 { margin: 0; font: 600 clamp(22px, 3.4vw, 30px)/1.1 var(--font-display); letter-spacing: -0.03em; text-wrap: balance; }
.view-h p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.eyebrow { font: 600 11px/1.3 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 13px; min-width: 40px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg.mono button { font-family: var(--font-mono); font-size: 12.5px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .v { font: 600 24px/1.15 var(--font-display); letter-spacing: -0.02em; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.BUY { background: var(--good); } .dot.WAIT { background: var(--warn); } .dot.AVOID { background: var(--bad); }
.stat.fng .v small { font: 500 13px var(--font-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.fng-bar { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--bad), var(--warn), var(--good)); position: relative; margin-top: 6px; }
.fng-bar i { position: absolute; top: -3px; width: 3px; height: 11px; border-radius: 2px; background: var(--fg); transform: translateX(-50%); }
@media (max-width: 720px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }
.select { height: 34px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); padding: 0 30px 0 10px; font-size: 13.5px; font-weight: 500; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 268px), 1fr)); gap: 12px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 14px 12px; display: grid; gap: 10px; cursor: pointer; transition: border-color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease); min-width: 0; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-2px); box-shadow: 0 10px 30px -18px color-mix(in srgb, var(--accent) 70%, transparent); }
.card-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
.coin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); color: #fff; background: hsl(var(--h) 55% 45%); flex: none; letter-spacing: -0.02em; }
.coin-n { min-width: 0; display: grid; }
.coin-n b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coin-n small { color: var(--faint); font: 500 11.5px var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { margin-left: auto; flex: none; font: 700 11px/1 var(--font-body); letter-spacing: 0.06em; padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
.pill.BUY { background: var(--good-bg); color: var(--good); }
.pill.WAIT { background: var(--warn-bg); color: var(--warn); }
.pill.AVOID { background: var(--bad-bg); color: var(--bad); }
.card-p { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-p .px { font-size: 21px; font-weight: 600; }
.ch { font-size: 13px; font-weight: 600; }
.up { color: var(--good); } .down { color: var(--bad); }
.spark { width: 100%; height: 44px; display: block; }
.meter-row { display: flex; align-items: center; gap: 10px; }
.meter { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; position: relative; }
.meter::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--surface) calc(10% - 2px) 10%); }
.meter i { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: 4px; background: var(--c, var(--accent)); transition: width .4s; }
.meter-row .num { font-size: 12.5px; color: var(--muted); min-width: 52px; text-align: right; }
.trends { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); }
.trends span { display: inline-flex; gap: 4px; align-items: center; }
.tr-up { color: var(--good); } .tr-down { color: var(--bad); } .tr-flat { color: var(--faint); }
.card .rm { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--bad); display: none; place-items: center; box-shadow: var(--shadow); font-size: 16px; line-height: 1; }
.editing .card .rm { display: grid; }
.editing .card { animation: wiggle .3s ease-in-out 1; }
@keyframes wiggle { 30% { transform: rotate(-0.6deg); } 70% { transform: rotate(0.6deg); } }
.card.add { place-items: center; align-content: center; min-height: 170px; border-style: dashed; color: var(--muted); font-weight: 600; background: transparent; }
.card.add svg { width: 26px; height: 26px; }
.compact .card { gap: 6px; padding: 10px 12px; }
.compact .spark, .compact .trends { display: none; }
.compact .card-p .px { font-size: 17px; }
.compact .card.add { min-height: 96px; }
.flash-up { animation: fu .7s; } .flash-down { animation: fd .7s; }
@keyframes fu { from { color: var(--good); text-shadow: 0 0 12px var(--good-bg); } }
@keyframes fd { from { color: var(--bad); text-shadow: 0 0 12px var(--bad-bg); } }
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.4s infinite; border-radius: 6px; color: transparent !important; }
@keyframes sk { to { background-position: -200% 0; } }
.section-h { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.section-h h2 { margin: 0; font: 600 16px/1.2 var(--font-display); letter-spacing: -0.02em; }
.note { color: var(--muted); font-size: 12.5px; margin: 18px 0 0; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r-card); padding: 22px; color: var(--muted); text-align: center; }

/* ---------- Chart view ---------- */
.chart-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chart-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.chart-head h1 { margin: 0; font: 600 clamp(20px, 3vw, 26px)/1.1 var(--font-display); letter-spacing: -0.03em; }
.chart-head h1 small { font: 500 13px var(--font-mono); color: var(--faint); margin-left: 6px; letter-spacing: 0; }
.chart-head .px { font-size: clamp(20px, 3vw, 26px); font-weight: 600; }
.chart-head .pill { margin-left: 0; font-size: 12px; padding: 7px 11px; }
.chart-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
@media (max-width: 1080px) { .chart-grid { grid-template-columns: minmax(0, 1fr); } }
.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; min-width: 0; }
#tv-main { height: clamp(300px, 52vh, 520px); }
#tv-rsi { height: 120px; border-top: 1px solid var(--line); }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.chart-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.chart-fail { display: grid; place-items: center; height: 100%; color: var(--muted); padding: 20px; text-align: center; }
.side { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; min-width: 0; }
.panel h3 { margin: 0 0 10px; font: 600 13px/1.3 var(--font-display); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.panel h3 small { margin-left: auto; font: 500 11.5px var(--font-body); color: var(--faint); }
.verdict-big { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.gauge { --s: 50; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--c) calc(var(--s) * 1%), var(--surface-2) 0); position: relative; }
.gauge::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
.gauge b { position: relative; font: 600 22px/1 var(--font-display); }
.verdict-big .vt { font: 700 17px/1.2 var(--font-display); letter-spacing: 0.02em; }
.verdict-big p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.factors { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.factors li { display: flex; gap: 8px; align-items: flex-start; }
.factors li .s { font: 600 11px/1.9 var(--font-mono); min-width: 30px; text-align: right; flex: none; }
.factors li.pos .s { color: var(--good); } .factors li.neg .s { color: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr auto; gap: 7px 12px; font-size: 13.5px; align-items: baseline; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kv .pct { font-size: 12px; min-width: 52px; }
.panel .sub { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
.pressure { display: grid; gap: 6px; }
.pbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; font: 600 12px/26px var(--font-mono); color: #fff; }
.pbar .b { background: var(--chart-up); padding-left: 8px; transition: flex-basis .5s; white-space: nowrap; }
.pbar .s { background: var(--chart-down); padding-right: 8px; text-align: right; transition: flex-basis .5s; white-space: nowrap; }
.plabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.whales { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; max-height: 220px; overflow: auto; }
.whales li { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; font-size: 12.5px; padding: 5px 8px; border-radius: 8px; background: var(--surface-2); align-items: center; }
.whales li .side-b { color: var(--good); font-weight: 600; } .whales li .side-s { color: var(--bad); font-weight: 600; }
.whales li time { color: var(--faint); font-family: var(--font-mono); font-size: 11.5px; }
.whales li.new { animation: wnew 1.2s; }
@keyframes wnew { from { background: var(--accent-soft); } }
.siglist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.siglist li { display: flex; gap: 8px; align-items: center; }
.siglist li .m { margin-left: auto; color: var(--faint); font-family: var(--font-mono); font-size: 11.5px; }
.bt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.bt div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.bt span { display: block; color: var(--muted); font-size: 11.5px; }
.bt b { font: 600 17px/1.3 var(--font-mono); }

/* ---------- News ---------- */
.movers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .movers { grid-template-columns: minmax(0, 1fr); } }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mlist li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 10px; cursor: pointer; }
.mlist li:hover { background: var(--surface-2); }
.mlist .coin { width: 28px; height: 28px; font-size: 9.5px; }
.mlist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.mlist .px { font-size: 12.5px; color: var(--muted); }
.mlist .ch { min-width: 70px; text-align: right; }
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.news li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.news .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
.news .meta b { color: var(--muted); font-weight: 600; }
.news a.title { color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15.5px; line-height: 1.35; overflow-wrap: anywhere; }
.news a.title:hover { color: var(--accent); }
.news p { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.tag { font: 600 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.tag.up { background: var(--good-bg); color: var(--good); } .tag.down { background: var(--bad-bg); color: var(--bad); }
.ghost-lines { display: grid; gap: 10px; margin-top: 14px; }
.ghost-lines div { height: 14px; border-radius: 7px; background: var(--surface-2); }

/* ---------- P2P ---------- */
.p2p { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .p2p { grid-template-columns: minmax(0, 1fr); } }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .form { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
.field input { height: 42px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; color: var(--fg); font: 600 16px var(--font-mono); width: 100%; min-width: 0; }
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.result { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.result div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.result span { display: block; font-size: 12px; color: var(--muted); }
.result b { font: 600 19px/1.3 var(--font-mono); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 14px; }
.checks li { display: flex; gap: 10px; }
.checks li::before { content: ""; flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 6px; background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- Learn ---------- */
.learn { display: grid; gap: 10px; max-width: 820px; }
.learn details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; }
.learn summary { cursor: pointer; list-style: none; padding: 14px 0; font-weight: 600; font-size: 15.5px; display: flex; align-items: center; gap: 12px; }
.learn summary::-webkit-details-marker { display: none; }
.learn summary .n { font: 600 12px var(--font-mono); color: var(--accent); min-width: 22px; }
.learn summary::after { content: "+"; margin-left: auto; font: 500 20px/1 var(--font-mono); color: var(--faint); transition: transform .2s; }
.learn details[open] summary::after { transform: rotate(45deg); }
.learn .body { padding: 0 0 14px 34px; color: var(--fg); font-size: 14.5px; max-width: 68ch; }
.learn .body p { margin: 0 0 8px; }
.learn .body ul, .learn .body ol { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- Settings ---------- */
.prefs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 860px) { .prefs { grid-template-columns: minmax(0, 1fr); } }
.pref { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.pref:first-of-type { border-top: 0; padding-top: 0; }
.pref > label, .pref > .lbl { font-weight: 600; font-size: 13.5px; }
.pref .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.pref > .seg, .pref > .swatches, .pref > .row { justify-self: start; }
.swatches { display: flex; gap: 10px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.assets { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.assets li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); }
.assets .coin { width: 28px; height: 28px; font-size: 9.5px; }
.assets .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.assets .nm small { color: var(--faint); font: 500 11.5px var(--font-mono); margin-left: 6px; }
.mini { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 14px; color: var(--muted); }
.mini:disabled { opacity: .35; cursor: default; }
.mini.del { color: var(--bad); }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.toggle input { appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--line-2); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(16px); }
.toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: start center; padding: calc(60px + env(safe-area-inset-top, 0px)) 16px 16px; background: rgba(4, 8, 14, 0.55); backdrop-filter: blur(3px); }
.modal[hidden] { display: none; }
.sheet { width: min(520px, 100%); max-height: calc(100vh - 120px); display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.sheet header { display: flex; align-items: center; padding: 14px 16px 8px; }
.sheet header h2 { margin: 0; font: 600 16px var(--font-display); }
.sheet header .icon-btn { margin-left: auto; }
.sheet .search { margin: 0 16px 10px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font-size: 15px; }
.sheet .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.results { list-style: none; margin: 0; padding: 0 8px 10px; overflow: auto; }
.results li button { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 0; background: transparent; border-radius: 10px; text-align: left; }
.results li button:hover, .results li button:focus-visible { background: var(--surface-2); }
.results .coin { width: 30px; height: 30px; font-size: 9.5px; }
.results .nm small { color: var(--faint); font: 500 11.5px var(--font-mono); margin-left: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}


/* ---------- Анімації ---------- */
@property --s { syntax: "<number>"; inherits: true; initial-value: 0; }
.gauge { transition: --s .9s var(--ease); animation: gaugeIn 1s var(--ease) both; }
@keyframes gaugeIn { from { --s: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes grow { from { width: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
main > section.enter { animation: viewIn .38s var(--ease) both; }
.anim > * { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 32ms); }
.anim .meter i { animation: grow .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 32ms + 120ms); }
.anim .spark-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 32ms + 80ms); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }

/* ---------- Перемикач ринків ---------- */
.mswitch { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 16px; max-width: 100%; overflow-x: auto; }
.mswitch a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 10px; white-space: nowrap; transition: background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease); }
.mswitch a:hover { color: var(--fg); }
.mswitch a[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.mswitch a[aria-current="page"]::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }

/* ---------- Мемкоїни ---------- */
.risk-note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--bad-bg); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); margin-bottom: 14px; }
.risk-note svg { width: 22px; height: 22px; color: var(--bad); flex: none; margin-top: 1px; }
.risk-note b { color: var(--bad); font: 600 14px var(--font-display); letter-spacing: -0.01em; }
.risk-note p { margin: 3px 0 0; font-size: 13.5px; color: var(--fg); max-width: 92ch; }
.meme-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.tag.risk { background: var(--bad-bg); color: var(--bad); }

/* ---------- Акції ---------- */
.input { height: 34px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13.5px; min-width: 0; width: 200px; max-width: 100%; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
@media (max-width: 640px) { .toolbar .input { width: 100%; order: -1; flex-basis: 100%; } .toolbar .select { flex: 1; } }
.trends .date { margin-left: auto; color: var(--faint); }
.chart-bar .tag { font-size: 12px; padding: 6px 10px; }

/* ---------- Підключення ---------- */
.conn { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 10px; }
.conn-i { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.conn-i .coin { width: 38px; height: 38px; font-size: 12px; }
.conn-t { display: grid; gap: 1px; min-width: 0; }
.conn-t b { font-weight: 600; overflow-wrap: anywhere; }
.conn-t small { color: var(--faint); font-size: 11.5px; overflow-wrap: anywhere; }
.conn-t p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.conn-i[data-st="on"] .st i { animation: pulse2 2s ease-in-out infinite; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); } }
@media (max-width: 480px) { .conn-i { grid-template-columns: 38px minmax(0, 1fr); } .conn-i .st { grid-column: 2; justify-self: start; } }

/* ---------- Ще ---------- */
.more { display: grid; gap: 10px; max-width: 640px; }
.more-i { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); transition: border-color .2s var(--ease), transform .2s var(--ease); }
.more-i:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateX(2px); }
.more-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.more-ic svg { width: 22px; height: 22px; }
.more-t { display: grid; gap: 2px; flex: 1; min-width: 0; }
.more-t b { font-weight: 600; }
.more-t small { color: var(--muted); font-size: 13px; }
.more-i > svg { width: 18px; height: 18px; color: var(--faint); flex: none; }

</style>
</head>

    learn: [
      ["How to use TrendRadar", "<ol><li>Open <b>Market</b>: every coin has a verdict, <b>FAVORABLE</b>, <b>WAIT</b> or <b>UNFAVORABLE</b>.</li><li>Tap a coin to see its chart, why it got that verdict, a trade plan and the market pulse.</li><li>Before using real money, practice for 2–4 weeks: the Telegram bot runs a paper portfolio and shows honest results.</li></ol>"],
      ["What the verdict means", "<p>The 0–100 score combines simple rules: trends on three charts, RSI, momentum (MACD), how stretched the price is, and market mood.</p><ul><li><b>70+: FAVORABLE.</b> Most factors favor buying.</li><li><b>41–69: WAIT.</b> No clear picture.</li><li><b>40 or less: UNFAVORABLE.</b> Most factors are against.</li></ul><p>It is not a guarantee: price can fall even when the verdict is favorable. The best case is a favorable verdict plus a fresh buy signal.</p>"],
      ["Reading candles", "<p>Each candle is one period: 15 minutes, an hour, a day. <b>Green</b>: price rose during the period, <b>red</b>: it fell. The thick body spans open to close, the thin wicks show the high and low.</p><p>Short candles (15m, 1h) give many signals and a lot of noise. Longer ones (4h, 1d) are calmer and more reliable for beginners.</p>"],
      ["Trend and moving averages (EMA)", "<p>An EMA is the average price of the last N candles. <b>Yellow EMA20</b> is the short trend, <b>blue EMA50</b> medium, <b>purple EMA200</b> long.</p><p>Price above EMA200 means the overall trend is up. Buying in an uptrend has historically been safer than catching a falling price.</p>"],
      ["RSI: overbought and oversold", "<p>RSI runs from 0 to 100. <b>Below 30</b> the price has dropped hard (oversold). <b>Above 70</b> it has risen hard (overbought).</p><p>In an uptrend, an RSI bounce from below is often a good entry. Buying above 70 risks buying the top.</p>"],
      ["Stop-loss, target and position size", "<p>A <b>stop-loss</b> is the price where you exit if the idea fails. A <b>target</b> is where you take profit.</p><p>The key rule: <b>risk no more than 1–2% of your deposit per trade</b>. Position size = (deposit × risk%) ÷ distance to the stop. TrendRadar calculates it for you, so even 10 losses in a row won't wipe out the account.</p>"],
      ["Starting safely", "<ul><li>Trade with paper money for the first 2–4 weeks.</li><li>Then start with small amounts you can afford to lose.</li><li>Don't borrow and don't use leverage (futures): it is the fastest way to lose everything.</li><li>Write down every trade: why you entered and how it ended.</li></ul>"],
      ["Beginner traps", "<ul><li><b>FOMO</b>: buying after a sharp rise so you don't miss out often means buying the top.</li><li><b>\"Guaranteed profit\"</b>, \"95% accurate signals\", \"we double your deposit\" are scams.</li><li><b>Meme coins</b> are a lottery: you can make ×10, but more often you lose everything.</li><li>Never share your <b>seed phrase</b>, passwords or SMS codes.</li></ul>"],
      ["Big players (\"whales\")", "<p>Whales are funds, exchanges and large traders. Their trades of hundreds of thousands of dollars can move the price sharply. On the Chart tab, Market pulse shows such trades live, plus the balance of buy and sell orders.</p>"],
      ["Glossary", "<ul><li><b>Long</b>: profit when price rises. <b>Short</b>: profit when it falls.</li><li><b>Spot</b>: buying the coin itself. <b>Futures</b>: contracts, often with leverage (very risky).</li><li><b>USDT</b>: a stablecoin worth about 1 dollar.</li><li><b>Volatility</b>: how much the price swings. <b>ATR</b>: its average range per candle.</li><li><b>Liquidity</b>: how easily you can buy or sell without moving the price.</li><li><b>Take-profit</b>: an automatic exit in profit.</li></ul>"],

<script>
/* TrendRadar engine: індикатори, сигнали, оцінка ВИГІДНО/ЧЕКАТИ/НЕВИГІДНО, перевірка на історії.
   Логіка повторює Python-бота (strategy.py, verdict.py, indicators.py), тому результати збігаються. */
(function (root) {
  "use strict";

  const TF_MS = { "1m": 6e4, "5m": 3e5, "15m": 9e5, "1h": 36e5, "4h": 1.44e7, "1d": 8.64e7, "1w": 6.048e8, "1M": 2.592e9 };
  const HTF = { "15m": "4h", "1h": "1d", "4h": "1d", "1d": "1w", "1w": "1M" };   // старший графік
  const LTF = { "15m": "5m", "1h": "15m", "4h": "1h", "1d": "4h", "1w": "1d" };  // молодший графік
  const MIN_BARS = 210;
  const MAX_SCORE = 5;
  const BUY_AT = 70, AVOID_AT = 40;
  const BUY_TYPES = new Set(["BUY_PULLBACK", "BUY_BREAKOUT"]);

  function ema(a, n) {
    const k = 2 / (n + 1), out = new Array(a.length);
    let prev = a[0];
    out[0] = prev;
    for (let i = 1; i < a.length; i++) { prev = a[i] * k + prev * (1 - k); out[i] = prev; }
    return out;
  }

  function wilder(a, n, start) {
    const al = 1 / n, out = new Array(a.length).fill(NaN);
    let prev = null;
    for (let i = start; i < a.length; i++) { prev = prev === null ? a[i] : al * a[i] + (1 - al) * prev; out[i] = prev; }
    return out;
  }

  /** bars: [{t,o,h,l,c,v}] → об'єкт масивів з індикаторами */
  function indicators(bars) {
    const n = bars.length;
    const c = bars.map(b => b.c), h = bars.map(b => b.h), l = bars.map(b => b.l), o = bars.map(b => b.o), v = bars.map(b => b.v);
    const ema20 = ema(c, 20), ema50 = ema(c, 50), ema200 = ema(c, 200);
    const gain = new Array(n).fill(0), loss = new Array(n).fill(0);
    for (let i = 1; i < n; i++) { const d = c[i] - c[i - 1]; gain[i] = Math.max(d, 0); loss[i] = Math.max(-d, 0); }
    const g = wilder(gain, 14, 1), ls = wilder(loss, 14, 1);
    const rsi = new Array(n).fill(100);
    for (let i = 1; i < n; i++) rsi[i] = ls[i] === 0 ? 100 : 100 - 100 / (1 + g[i] / ls[i]);
    const tr = new Array(n);
    for (let i = 0; i < n; i++) {
      tr[i] = i === 0 ? h[i] - l[i] : Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1]));
    }
    const atr = wilder(tr, 14, 0);
    const e12 = ema(c, 12), e26 = ema(c, 26);
    const macd = c.map((_, i) => e12[i] - e26[i]);
    const sig = ema(macd, 9);
    const macdHist = macd.map((m, i) => m - sig[i]);
    const volRatio = new Array(n).fill(1), high20prev = new Array(n).fill(NaN), chg = new Array(n).fill(NaN);
    let vsum = 0;
    for (let i = 0; i < n; i++) {
      vsum += v[i];
      if (i >= 20) vsum -= v[i - 20];
      if (i >= 19) { const avg = vsum / 20; volRatio[i] = avg > 0 ? v[i] / avg : 1; }
      if (i >= 20) { let m = -Infinity; for (let j = i - 20; j < i; j++) m = Math.max(m, h[j]); high20prev[i] = m; }
      if (i >= 1) chg[i] = (c[i] / c[i - 1] - 1) * 100;
    }
    const dist = c.map((x, i) => atr[i] > 0 ? (x - ema50[i]) / atr[i] : NaN);
    const trend = c.map((x, i) => (x > ema200[i] && ema50[i] > ema200[i]) ? "up" : (x < ema200[i] && ema50[i] < ema200[i]) ? "down" : "flat");
    return { n, t: bars.map(b => b.t), o, h, l, c, v, ema20, ema50, ema200, rsi, atr, macdHist, volRatio, high20prev, chg, dist, trend };

  /** Тренд старшого графіка станом на закриття кожної свічки основного (без підглядання в майбутнє). */
  function alignTrend(mainT, mainTf, htfT, htfTrend, htfTf) {
    const out = new Array(mainT.length).fill("flat");
    const htfClose = htfT.map((t, i) => (i + 1 < htfT.length ? htfT[i + 1] : t + TF_MS[htfTf]));
    let j = -1;
    for (let i = 0; i < mainT.length; i++) {
      const close = mainT[i] + TF_MS[mainTf];
      while (j + 1 < htfT.length && htfClose[j + 1] <= close) j++;
      if (j >= 0) out[i] = htfTrend[j];

      riskUsd, sizeUsd: Math.min(size, cap), capped: size > cap, rr: (target - entry) / perUnit,

    }
    if (buysAllowed && d.c[i] > d.ema200[i] && d.c[i] > d.high20prev[i] && d.c[p] <= d.high20prev[p] && d.volRatio[i] >= 1.5) {

    }
    if (d.c[p] >= d.ema200[p] && d.ema200[i] > d.c[i]) out.push({ type: "EXIT_TREND", i, price, reasons: [["r_trend_break", {}], ["r_trend_break2", {}]] });
    if (d.rsi[p] < 75 && d.rsi[i] >= 75) out.push({ type: "TAKE_PROFIT", i, price, reasons: [["r_rsi_high", { v: d.rsi[i] }], ["r_rsi_high2", {}]] });
    if (Math.abs(d.chg[i]) >= o.sharpPct) out.push({ type: "SHARP_MOVE", i, price, chg: d.chg[i], reasons: [["r_sharp1", {}], ["r_sharp2", {}]] });
    return out;
  }

  /** Оцінка 0–100 і вердикт BUY / WAIT / AVOID. ctx: {htf, ltf, fng, hasBuy, isCrypto} */
  function verdictAt(d, i, ctx) {
    ctx = ctx || {};
    const f = [], add = (k, pts, kw) => f.push([k, kw || {}, pts]);
    const dt = ctx.htf || "flat", m = d.trend[i], s = ctx.ltf || "flat";
    if (dt === "up") add("f_htf_up", 25); else if (dt === "down") add("f_htf_down", -25);
    if (m === "up") add("f_main_up", 15); else if (m === "down") add("f_main_down", -15);
    if (s === "up") add("f_ltf_up", 5); else if (s === "down") add("f_ltf_down", -5);
    const r = d.rsi[i];
    if (r < 30) { if (m === "up" || dt === "up") add("f_rsi_oversold", 20, { v: r }); else add("f_rsi_knife", -5, { v: r }); }
    else if (r < 45 && m === "up") add("f_rsi_pullback", 10, { v: r });
    else if (r > 70) add("f_rsi_overbought", -15, { v: r });
    if (d.macdHist[i] > d.macdHist[i - 1]) add("f_macd_up", 10); else add("f_macd_down", -10);
    if (d.dist[i] > 4) add("f_overextended", -10);
    if (ctx.isCrypto && ctx.fng) {
      if (ctx.fng.value < 25) add("f_fng_fear", 5, { v: ctx.fng.value });
      else if (ctx.fng.value > 75) add("f_fng_greed", -5, { v: ctx.fng.value });
    }
    if (ctx.hasBuy) add("f_signal", 15);
    const raw = Math.max(-100, Math.min(100, f.reduce((s2, x) => s2 + x[2], 0)));
    const score = Math.round((raw + 100) / 2);
    const verdict = score >= BUY_AT ? "BUY" : score <= AVOID_AT ? "AVOID" : "WAIT";
    const top = f.slice().sort((a, b) => Math.abs(b[2]) - Math.abs(a[2])).slice(0, 4);
    return { verdict, score, factors: f, top };
  }

  /** Перевірка стратегії на завантаженій історії (як backtest.py). */
  function backtest(d, htf, opts) {
    const o = Object.assign({}, DEFAULT_OPTS, opts);
    const fee = o.fees / 100, trades = [];
    let i = MIN_BARS;
    while (i < d.n - 1) {
      if (!signalsAt(d, i, htf, o).some(s => BUY_TYPES.has(s.type))) { i++; continue; }
      const a = d.atr[i], entry = d.o[i + 1];
      const stop = entry - o.atrStop * a, target = entry + o.atrTarget * a;
      let exit = null, reason = "open", j = i + 1;
      for (; j < d.n; j++) {
        if (d.l[j] <= stop) { exit = Math.min(stop, d.o[j]); reason = "stop"; break; }
        if (d.h[j] >= target) { exit = Math.max(target, d.o[j]); reason = "target"; break; }
      }
      if (exit === null) { exit = d.c[d.n - 1]; j = d.n - 1; }
      trades.push({ i, j, ret: (exit * (1 - fee) / (entry * (1 + fee)) - 1) * 100, reason, stopPct: (stop / entry - 1) * 100 });
      i = j + 1;
    }
    const closed = trades.filter(x => x.reason !== "open");
    const wins = closed.filter(x => x.ret > 0);
    let eq = 1, peak = 1, dd = 0;
    for (const x of trades) { eq *= 1 + o.risk / 100 * (x.stopPct ? x.ret / Math.abs(x.stopPct) : 0); peak = Math.max(peak, eq); dd = Math.max(dd, 1 - eq / peak); }
    return {
      trades, n: trades.length, closed: closed.length, wr: closed.length ? wins.length / closed.length * 100 : 0,
      avg: closed.length ? closed.reduce((s, x) => s + x.ret, 0) / closed.length : 0,
      ret: (eq - 1) * 100, dd: dd * 100, bh: d.n > MIN_BARS ? (d.c[d.n - 1] / d.c[MIN_BARS] - 1) * 100 : 0,
    };
  }

  const api = { TF_MS, HTF, LTF, MIN_BARS, MAX_SCORE, BUY_TYPES, ema, indicators, alignTrend, tradePlan, signalsAt, verdictAt, backtest };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.TREngine = api;
})(typeof window !== "undefined" ? window : globalThis);

        tries++;

  function startChartStream(sym, tf) {
    stopChartStream();
    A.pulse = { trades: [], whales: [], book: null };
    const P = A.P;
    A.chartWS = P.watchChart(sym, tf, k => {
      if (S.chartKind !== "crypto" || sym !== S.chartSym || tf !== S.chartTf || !A.c || !A.ca) return;
      const bars = A.ca.bars, last = bars[bars.length - 1];
      if (k.t < last.t) return;
      const bar = { t: k.t, o: k.o, h: k.h, l: k.l, c: k.c, v: k.v };
      if (k.t === last.t) bars[bars.length - 1] = bar; else bars.push(bar);
      try {
        A.c.candles.update({ time: ct(k.t), open: k.o, high: k.h, low: k.l, close: k.c });
        A.c.vol.update({ time: ct(k.t), value: k.v, color: (k.c >= k.o ? A.c.th.up : A.c.th.down) + "55" });
      } catch (e) { /* */ }
      A.lastPx = k.c;
      if (k.closed) { clearTimeout(A.reloadTimer); A.reloadTimer = setTimeout(loadChart, 1500); }
    }, tr => {
      const p = A.pulse;
      p.trades.push(tr);
      if (tr.usd >= (+S.whale || 100000)) { p.whales.unshift(Object.assign({ fresh: true }, tr)); p.whales.length = Math.min(p.whales.length, 14); }
    });
    const pollDepth = async () => {
      try {
        const d = await P.depth(sym);
        const mid = (d.bids[0][0] + d.asks[0][0]) / 2, lo = mid * 0.995, hi = mid * 1.005;
        A.pulse.book = { bid: d.bids.filter(x => x[0] >= lo).reduce((s, x) => s + x[0] * x[1], 0), ask: d.asks.filter(x => x[0] <= hi).reduce((s, x) => s + x[0] * x[1], 0) };
      } catch (e) { /* наступна спроба через 3 с */ }
    };
    pollDepth();
    A.depthTimer = setInterval(pollDepth, 3000);
    A.pulseTimer = setInterval(() => { renderPulse(); updatePlanLive(); }, 1000);
    renderPulse();
  }

  function calcP2P() {
    const p = S.p2p, el = $("#p2p-res");
    if (!el) return;
    const buy = +p.buy, sell = +p.sell, amt = +p.amount, fee = (+p.fee || 0) / 100, bank = (+p.bank || 0) / 100;
    if (!(buy > 0 && sell > 0 && amt > 0)) { el.innerHTML = ""; return; }
    const usdt = amt / buy * (1 - fee);
    const out = usdt * sell * (1 - fee) * (1 - bank);
    const profit = out - amt, margin = profit / amt * 100;
    const be = buy / ((1 - fee) * (1 - fee) * (1 - bank));
    el.innerHTML = `<div><span>${esc(t("p2p_profit"))}</span><b class="${profit >= 0 ? "up" : "down"}">${profit >= 0 ? "+" : "−"}${fmtNum(Math.abs(profit), 2)} ₴</b></div>
      <div><span>${esc(t("p2p_margin"))}</span><b class="${margin >= 0 ? "up" : "down"}">${fmtPct(margin)}</b></div>
      <div><span>${esc(t("p2p_usdt"))}</span><b>${fmtNum(usdt, 2)}</b></div>
      <div><span>${esc(t("p2p_breakeven"))}</span><b>${fmtNum(be, 2)} ₴</b></div>`;
  }

  /* ---------- Додавання / приховування ---------- */
  async function openAdd(kind) {
    A.addMode = kind || "market";
    const m = $("#modal");
    m.hidden = false;
    $("#add-title").textContent = A.addMode === "chart" ? t("find_asset") : A.addMode === "market" ? t("add_title") : t("show_hidden");
    $("#add-close").setAttribute("aria-label", t("close"));
    const inp = $("#add-q");
    inp.placeholder = A.addMode === "chart" ? t("search_all") : A.addMode === "stocks" ? t("search_stocks") : t("search_ph");
    inp.value = "";
    paintAdd();
    setTimeout(() => inp.focus(), 30);
    if (A.addMode === "chart") ensureStocks().then(() => { if (!m.hidden) paintAdd(); });
    if ((A.addMode === "market" || A.addMode === "chart") && A.P && (!A.all || Date.now() - A.allAt > 120000)) {
      try { A.all = await A.P.allTickers(); A.allAt = Date.now(); } catch (e) { /* */ }
      if (!m.hidden) paintAdd();
    }
  }
  function paintAdd() {
    const q = ($("#add-q").value || "").trim().toUpperCase(), mode = A.addMode;
    let items = [];
    if (mode === "chart") {
      const cr = (A.all || []).slice().sort((p, r) => r.qv - p.qv).filter(x => !q || x.symbol.includes(q) || nameOf(x.symbol).toUpperCase().includes(q)).slice(0, q ? 25 : 15)
        .map(x => ({ sym: "c:" + x.symbol, ico: coinIco(x.symbol), name: nameOf(x.symbol), sub: D.base(x.symbol) + " · " + t("kind_crypto"), right: fmtPct(x.chg), up: x.chg >= 0 }));
      const st = (A.stocksDoc ? A.stocksDoc.stocks : []).filter(x => !q || x.symbol.includes(q) || x.name.toUpperCase().includes(q) || sName(x).toUpperCase().includes(q)).slice(0, q ? 25 : 15)
        .map(x => ({ sym: "s:" + x.symbol, ico: icoTxt(x.symbol.replace(".", ""), x.symbol.replace(".", "")), name: sName(x), sub: x.symbol + " · " + t(x.sector === "etf" ? "kind_etf" : "kind_stock"), right: fmtPct(+x.chg), up: x.chg >= 0 }));
      items = q ? [...cr, ...st].sort((p, r) => (r.name.toUpperCase().startsWith(q) || r.sub.startsWith(q)) - (p.name.toUpperCase().startsWith(q) || p.sub.startsWith(q))) : [...cr, ...st];
    } else if (mode === "market") {
      items = (A.all || []).slice().sort((p, r) => r.qv - p.qv).filter(x => !q || x.symbol.includes(q) || nameOf(x.symbol).toUpperCase().includes(q)).slice(0, 40)
        .map(x => ({ sym: x.symbol, ico: coinIco(x.symbol), name: nameOf(x.symbol), sub: D.base(x.symbol), right: S.watch.includes(x.symbol) ? "✓" : fmtPct(x.chg), up: x.chg >= 0 }));
    } else if (mode === "memes") {
      items = S.memeHidden.filter(s => !q || s.includes(q) || nameOf(s).toUpperCase().includes(q)).map(s => ({ sym: s, ico: coinIco(s), name: nameOf(s), sub: D.base(s), right: "+", up: true }));
    } else {
      items = S.stockHidden.map(stockBy).filter(Boolean).filter(x => !q || x.symbol.includes(q) || x.name.toUpperCase().includes(q))
        .map(x => ({ sym: x.symbol, ico: icoTxt(x.symbol.replace(".", ""), x.symbol.replace(".", "")), name: x.name, sub: x.symbol, right: "+", up: true }));
    }
    $("#add-res").innerHTML = items.length ? items.map(x => `<li><button type="button" data-addsym="${esc(x.sym)}">${x.ico}<span class="nm">${esc(x.name)}<small>${esc(x.sub)}</small></span><span class="ch ${x.up ? "up" : "down"}">${esc(x.right)}</span></button></li>`).join("")
      : `<li class="note" style="padding:12px">${esc((mode === "market" || mode === "chart") && !A.all ? t("loading") : t("no_results"))}</li>`;
  }
  function closeAdd() { $("#modal").hidden = true; }
  async function addSymbol(sym) {
    const mode = A.addMode;
    if (mode === "chart") { closeAdd(); if (sym.startsWith("s:")) openStock(sym.slice(2)); else openChart(sym.slice(2)); return; }
    if (mode === "memes") { S.memeHidden = S.memeHidden.filter(x => x !== sym); save(); toast(t("added", { s: D.base(sym) })); paintAdd(); refreshList("memes"); startTickerStream(); return; }
    if (mode === "stocks") { S.stockHidden = S.stockHidden.filter(x => x !== sym); save(); toast(t("added", { s: sym })); paintAdd(); if (A.view === "stocks") renderStocks(); return; }
    if (S.watch.includes(sym)) { toast(t("already", { s: D.base(sym) })); return; }
    S.watch.push(sym); save();
    toast(t("added", { s: D.base(sym) }));
    paintAdd();
    startTickerStream();
    if (A.view === "market") renderCrypto("market");
    if (A.view === "prefs") renderPrefs();
    try { A.an.set(sym + "|" + S.tf, await analyze(sym, S.tf)); } catch (e) { A.an.set(sym + "|" + S.tf, { sym, tf: S.tf, error: true }); }
    if (A.view === "market") renderCrypto("market");
  }
  function removeSymbol(sym, kind) {
    if (kind === "memes") { if (!S.memeHidden.includes(sym)) S.memeHidden.push(sym); }
    else if (kind === "stocks") { if (!S.stockHidden.includes(sym)) S.stockHidden.push(sym); }
    else S.watch = S.watch.filter(x => x !== sym);
    save();
    toast(t("removed", { s: kind === "stocks" ? sym : D.base(sym) }));
    startTickerStream();
    rerenderView();
  }

  /* ---------- Маршрути ---------- */
  function rerenderView() {
    const v = A.view;
    if (v === "market" || v === "memes") renderCrypto(v);
    else if (v === "stocks") renderStocks();
    else if (v === "prefs") renderPrefs();
  }
  function route() {
    let v = (location.hash || "").replace(/^#/, "");
    if (!VIEWS.includes(v)) v = "market";
    const changed = v !== A.view;
    if (A.view === "chart" && v !== "chart") leaveChart();
    if (changed) { A.edit = false; A.anim = true; }
    A.view = v;
    VIEWS.forEach(n => {
      const sec = $("#v-" + n);
      sec.hidden = n !== v;
      if (n === v && changed) { sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter"); }
    });
    markNav();
    if (v === "market") { renderCrypto("market"); if (!A.an.size && A.P) refreshList("market"); }
    else if (v === "memes") {
      const first = !A.memesSeen;
      A.memesSeen = true;
      renderCrypto("memes");
      if (A.P && (first || !memeList().some(s => A.an.has(s + "|" + S.tf)))) refreshList("memes").then(startTickerStream);
    }
    else if (v === "stocks") renderStocks();
    else if (v === "chart") enterChart();
    else if (v === "news") renderNews();
    else if (v === "p2p") renderP2P();
    else if (v === "learn") renderLearn();
    else if (v === "prefs") renderPrefs();
    else if (v === "connect") renderConnect();
    else if (v === "more") renderMore();
    if (changed) window.scrollTo(0, 0);
  }
  function openChart(sym) {
    S.chartKind = "crypto"; S.chartSym = sym; S.chartTf = S.tf; save();
    if (A.chartBuilt) { fillSymSelect(); $$("#c-tf [data-tf]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tf === S.chartTf)); }
    startTickerStream();
    if (location.hash === "#chart") enterChart(); else location.hash = "#chart";
  }
  function openStock(sym) {
    S.chartKind = "stock"; S.chartStock = sym; save();
    if (location.hash === "#chart") enterChart(); else location.hash = "#chart";
  }
  function rerenderAll() {
    renderShell();
    if (A.chartBuilt) { destroyChart(); A.chartBuilt = false; }
    A.view = "";
    route();
  }

  /* ---------- Події ---------- */
  function bind() {
    document.addEventListener("click", e => {
      const el = e.target.closest("button, [data-open], [data-stock], a[data-nav]");
      if (!el) return;
      const d = el.dataset;
      if (d.rm) { e.stopPropagation(); removeSymbol(d.rm, d.kind); return; }
      if (d.open && !A.edit) { openChart(d.open); return; }
      if (d.stock && !A.edit) { openStock(d.stock); return; }
      if (d.act === "add") { openAdd(d.kind || "market"); return; }
      if (d.act === "find") { openAdd("chart"); return; }
      if (d.act === "edit") { A.edit = !A.edit; rerenderView(); return; }
      if (d.act === "anim") return;
      if (d.act === "refresh") { refreshList(currentListKind() || "market"); toast(t("loading")); return; }
      if (d.act === "retry") { connect(); return; }
      if (d.act === "hide-banner") { A.bannerHidden = true; try { sessionStorage.setItem("trendradar.banner", "hidden"); } catch (x) { /* */ } updateModeUI(); return; }
      if (d.act === "install") { doInstall(); return; }
      if (d.act === "reset-assets") { S.watch = DEFAULT_WATCH.slice(); save(); startTickerStream(); refreshList("market"); renderPrefs(); toast(t("saved")); return; }
      if (d.act === "unhide-all") { S.memeHidden = []; S.stockHidden = []; save(); renderPrefs(); toast(t("saved")); return; }
      if (d.act === "reset-all") {
        if (!A.resetArmed) { A.resetArmed = true; renderPrefs(); setTimeout(() => { A.resetArmed = false; if (A.view === "prefs") renderPrefs(); }, 4000); return; }
        A.resetArmed = false; S = JSON.parse(JSON.stringify(DEFAULTS)); save(); rerenderAll(); connect(); toast(t("saved")); return;
      }
      if (d.filter) { S.filter = d.filter; save(); renderCrypto("market"); return; }
      if (d.mfilter) { S.memeFilter = d.mfilter; save(); renderCrypto("memes"); return; }
      if (d.sfilter) { S.stockFilter = d.sfilter; save(); renderStocks(); return; }
      if (d.tf && el.closest("#m-tf")) { S.tf = d.tf; save(); rerenderView(); refreshList(currentListKind() || "market"); return; }
      if (d.tf && el.closest("#c-tf")) { S.chartTf = d.tf; save(); $$("#c-tf [data-tf]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tf === d.tf)); loadChart(); return; }
      if (d.ind) { S.ind[d.ind] = !S.ind[d.ind]; save(); el.setAttribute("aria-pressed", S.ind[d.ind]); applyIndicatorVisibility(); return; }
      if (d.news) { S.newsAll = d.news === "all"; save(); renderNews(); return; }
      if (d.addsym) { addSymbol(d.addsym); return; }
      if (d.move !== undefined) {
        const i = +d.move, j = i + +d.dir;
        if (j < 0 || j >= S.watch.length) return;
        [S.watch[i], S.watch[j]] = [S.watch[j], S.watch[i]]; save(); renderPrefs(); return;
      }
      if (d.set) {
        const k = d.set, v = d.val;
        S[k] = v; save();
        if (k === "lang") rerenderAll();
        else if (k === "theme" || k === "accent") { applyTheme(); renderPrefs(); }
        else if (k === "data") { renderPrefs(); connect().then(() => { if (A.view === "prefs") renderPrefs(); }); }
        else if (k === "tf") { renderPrefs(); refreshList("market"); }
        else renderPrefs();
        toast(t("saved"));
        return;
      }
      if (el.id === "theme-btn") { S.theme = { system: "dark", dark: "light", light: "system" }[S.theme] || "system"; save(); applyTheme(); if (A.view === "prefs") renderPrefs(); return; }
      if (el.id === "mode") { location.hash = "#connect"; return; }
      if (el.id === "install-top") { doInstall(); return; }
      if (el.id === "add-close") { closeAdd(); return; }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !$("#modal").hidden) closeAdd();
      if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open][tabindex], [data-stock][tabindex]")) {
        e.preventDefault();
        if (A.edit) return;
        if (e.target.dataset.open) openChart(e.target.dataset.open); else openStock(e.target.dataset.stock);
      }
    });
    $("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeAdd(); });
    $("#add-q").addEventListener("input", paintAdd);
    document.addEventListener("change", e => {
      const el = e.target;
      if (el.id === "m-sort") { S.sort = el.value; save(); renderCrypto("market"); }
      else if (el.id === "mm-sort") { S.memeSort = el.value; save(); renderCrypto("memes"); }
      else if (el.id === "s-sort") { S.stockSort = el.value; save(); renderStocks(); }
      else if (el.id === "s-sector") { S.stockSector = el.value; save(); renderStocks(); }
      else if (el.id === "c-sym") {
        const k = el.value.slice(0, 1), sym = el.value.slice(2);
        if (k === "s") { S.chartKind = "stock"; S.chartStock = sym; } else { S.chartKind = "crypto"; S.chartSym = sym; startTickerStream(); }
        save(); loadChart();
      }
      else if (el.dataset.indset) { S.ind[el.dataset.indset] = el.checked; save(); applyIndicatorVisibility(); toast(t("saved")); }
      else if (el.dataset.num) {
        const k = el.dataset.num, v = parseFloat(el.value);
        if (isFinite(v) && v > 0) { S[k] = k === "risk" ? Math.min(100, v) : v; save(); toast(t("saved")); }
      }
    });
    document.addEventListener("input", e => {
      const el = e.target;
      if (el.dataset.p2p) { S.p2p[el.dataset.p2p] = el.value; save(); calcP2P(); }
      if (el.id === "s-q") {
        A.stockQ = el.value;
        clearTimeout(A.qTimer);
        A.qTimer = setTimeout(() => {
          const pos = el.selectionStart;
          renderStocks().then(() => { const n = $("#s-q"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* */ } } });
        }, 160);
      }
    });
    window.addEventListener("hashchange", () => {
      if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        try { document.startViewTransition(() => route()); } catch (e) { route(); }
      } else route();
    });
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (mq && mq.addEventListener) mq.addEventListener("change", () => { if (S.theme === "system" && A.c) rebuildChart(); });
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); A.installEvt = e; $("#install-top").hidden = false; if (A.view === "prefs") renderPrefs(); });
    window.addEventListener("appinstalled", () => { A.installEvt = null; $("#install-top").hidden = true; });
  }
  async function doInstall() {
    if (!A.installEvt) { toast(t("install_hint")); return; }
    A.installEvt.prompt();
    try { await A.installEvt.userChoice; } catch (e) { /* */ }
    A.installEvt = null;
    $("#install-top").hidden = true;
    if (A.view === "prefs") renderPrefs();
  }

  async function loadSiteData() {
    A.news = await D.loadSiteJSON("data/news.json");
    if (A.view === "news") renderNews();
    if (A.view === "connect") renderConnect();
  }

  function init() {
    bind();
    A.view = "";
    renderShell();
    route();
    connect();
    loadSiteData();
    ensureStocks();
    setInterval(loadSiteData, 10 * 60000);
    if (window.TR_PWA && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { /* без офлайн-режиму */ });
  }
  window.TRApp = { state: () => S, runtime: () => A };
  init();
})();

</script>
